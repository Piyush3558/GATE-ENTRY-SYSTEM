name: Backend CI and Render Deploy

on:
  pull_request:
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Audit and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check JavaScript syntax
        run: npm run check

  deploy:
    name: Sync secrets and deploy to Render
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.BACKEND_DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-backend
    steps:
      - name: Verify deployment configuration
        shell: bash
        run: |
          required_values=(
            RENDER_API_KEY
            RENDER_SERVICE_ID
            DATABASE_URL
            JWT_SECRET
            CLOUDINARY_CLOUD_NAME
            CLOUDINARY_API_KEY
            CLOUDINARY_API_SECRET
          )

          for key in "${required_values[@]}"; do
            if [[ -z "${!key}" ]]; then
              echo "Missing required GitHub Actions secret: $key" >&2
              exit 1
            fi
          done
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Synchronize runtime secrets
        shell: bash
        run: |
          update_render_env() {
            local key="$1"
            local value="$2"
            local encoded_key
            local payload

            encoded_key="$(jq -rn --arg value "$key" '$value | @uri')"
            payload="$(jq -cn --arg value "$value" '{value: $value}')"

            curl --fail --silent --show-error \
              --retry 3 \
              --output /dev/null \
              --request PUT \
              --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/${encoded_key}" \
              --header "Authorization: Bearer ${RENDER_API_KEY}" \
              --header "Accept: application/json" \
              --header "Content-Type: application/json" \
              --data "$payload"
          }

          update_render_env DATABASE_URL "$DATABASE_URL"
          update_render_env DB_SSL "true"
          update_render_env DB_SSL_REJECT_UNAUTHORIZED "false"
          update_render_env JWT_SECRET "$JWT_SECRET"
          update_render_env CLOUDINARY_CLOUD_NAME "$CLOUDINARY_CLOUD_NAME"
          update_render_env CLOUDINARY_API_KEY "$CLOUDINARY_API_KEY"
          update_render_env CLOUDINARY_API_SECRET "$CLOUDINARY_API_SECRET"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Deploy verified commit
        shell: bash
        run: |
          payload="$(jq -cn \
            --arg commit_id "$GITHUB_SHA" \
            '{commitId: $commit_id, clearCache: "do_not_clear", deployMode: "build_and_deploy"}')"

          curl --fail --silent --show-error \
            --retry 3 \
            --output /dev/null \
            --request POST \
            --url "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$payload"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
